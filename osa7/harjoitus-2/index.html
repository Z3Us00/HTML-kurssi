<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>harjoitus 2</title>
</head>
<body>
    <form action="">
        <label for="nimi">Nimi</label>
        <input id="nimi" name="nimi" type="text" required>

        <label for="email">Sähköposti</label>
        <input type="email" name="email" id="email" required minlength="5">

        <label for="password">Salasana</label>
        <input type="password" name="password" id="password" required
        pattern="(?=.*[A-Za-z])(?=.\d).{7,}" 
        title="Vähintään 7 merkkiä pitkä, 1 numero ja 1 iso sekä pieni kirjain">

        <label for="birth">Syntymäpäivä</label>
        <input type="date" name="birthdate" id="birthdate">

        <label for="birth">Käyttöehdot</label>
        <input type="checkbox" name="checkbox" id="tos" required>
    </form>
</body>
</html>
