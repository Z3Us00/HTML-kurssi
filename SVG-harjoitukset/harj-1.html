<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg id="japaninLippu" width="500" height="300" viewBox="0 0 500 300">
        <title>Japanin lippu</title>
        <desc>Japanin lippu beigellä taustalla. Circle elementti lipun keskikohtana, 1 Rect elementti- lipun pohjana ja toinen rect elementti lipun tausta koristeena</desc>
        <g class="lippu" transform="translate(0,0)">
            <rect class="tyyliTausta" x="5" y="40" width="180" height="120"/>
            <rect class="lipunPohja" x="20" y="50" width="150" height="100"/>
            <circle class="lipunKeski" cx="95" cy="100" r="22"/>
        </g>

        <title>Tieto Japanin lipusta</title>
        <desc>Historiallista tieto japanin lipusta kuten käyttöönotto vuosi</desc>
        <text x="10" y="180" font-size="20">Japanin lippu, otettu käyttöön vuonna 1999.</text>
    </svg>

    <style>
        .lipunKeski{
            fill: red;
        }
        .lipunPohja{
            fill: white;
            stroke:rgb(119, 54, 54);
            stroke-width: 3;
        }
        .tyyliTausta{
            fill:burlywood;
            opacity: 0.8;
        }
    </style>
</body>
</html>
