<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="kuvaCanvas"></canvas>
    <script>
        const canvas = document.getElementById("kuvaCanvas");  
        const ctx = canvas.getContext("2d"); 
        const kuva = new Image();  

        kuva.src = "kukka_1.jpg";  

        kuva.onload = function() {
            ctx.drawImage(kuva, 20, 20)
        };
    </script>
</body>
</html>
