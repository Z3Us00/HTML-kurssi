<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="animaatioCanvas" width="500" height="500"></canvas>
    <script>
        const canvas = document.getElementById("animaatioCanvas");  
        const ctx = canvas.getContext("2d");  
        let x = 50;  
        let y = 100;  
        let vx = 4;
        let vy = 4;
        
        function animation() {  
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);  

        x = x + vx;  
        y = y + vy;  

        ctx.beginPath();  
        ctx.arc(x, y, 35, 0, 2 * Math.PI);  
        ctx.fillStyle = "green";  
        ctx.fill();  
        
        requestAnimationFrame(animation);  
        }  
        
        animation();  
    </script>
</body>
</html>
