<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="piirros" width="600" height="600" role="img" aria-label=""></canvas>
    <input type="color"id="color">
    <script>
        const canvas = document.getElementById("piirros")
        const selector = document.getElementById("color")
        const ctx = canvas.getContext("2d");

        let color = selector.value;

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        canvas.addEventListener("mousedown", function(event){
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();  
            lastX = event.clientX - rect.left;  
            lastY = event.clientY - rect.top;  
        });
        canvas.addEventListener("mousemove", function(event){
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            if(isDrawing){
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = color;
                ctx.lineWidth = 5;
                ctx.stroke();

                lastX = x;
                lastY = y;
            }
        });

        canvas.addEventListener("mouseup", function(event){
            isDrawing = false;
        });

        selector.addEventListener("input", function(event) {  
            color = event.target.value;  
        }); 
        ctx.strokeStyle = "black";
        ctx.strokeRect(0,0, canvas.width, canvas.height);
    </script>
</body>
</html>
