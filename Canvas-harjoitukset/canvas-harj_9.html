<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="ympyraCanvas" width="500" height="400"></canvas>
    <script>
        const canvas = document.getElementById("ympyraCanvas")
        const ctx = canvas.getContext("2d")

        ctx.beginPath()

        ctx.arc(200, 150, 60, 0, 2 * Math.PI)
        ctx.fillStyle = "blue";
        ctx.fill()
    </script> 
</body>
</html>
