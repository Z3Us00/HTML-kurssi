<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Info</legend>
            <label for="name" class="name-label">
                Full Name
                <input id="name" type="text" class="name-input">
            </label>
            
            <label for="email" class="email-label">
                Email
                <input id="email" type="email" class="email-input" required>
            </label>
        </fieldset>

        <fieldset>
            <legend>Password</legend>
            <label for="password" class="pass-label">
                Password
                <input id="password" type="pass-input" class="pass-inp" required>
            </label>

            <label for="password" class="conbfirm-label">
                Confirm Password
                <input id="password" type="password" class="confirm-inp" required>
            </label>

            <label for="tos">Käyttäjä ehdot
                <input id="tos" type="checkbox" required>
            </label>
        </fieldset>

        <button class="submit">Lähetä</button>
    </form>
</body>
</html>
